<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#173c31}

.kicker{color:#176d50;font-weight:800;font-size:12px;letter-spacing:.06em;margin:0 0 12px}
.note{color:#50675d;line-height:1.75}#status{padding:12px 0;line-height:1.6}
article{border:1px solid #dae8dd;border-radius:12px;padding:18px;margin:12px 0}
article h2{font-size:19px;margin:5px 0}article p{line-height:1.65;color:#52665d}
article a{display:inline-block;padding:10px 14px;background:#0e6145;border-radius:9px;color:white;font-weight:700;text-decoration:none}

<body>
<main>

<p id="status" role="status">초대 링크의 유효성을 확인하고 있습니다.</p>
<section id="content" hidden>

<p id="warning"></p>
</section>
</main>

<script src="./share.js"></script>
