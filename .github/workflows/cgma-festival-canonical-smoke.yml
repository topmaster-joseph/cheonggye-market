name: CGMA Festival Canonical Smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'verify-festival-production.mjs'
      - '.github/workflows/cgma-festival-canonical-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'verify-festival-production.mjs'
      - '.github/workflows/cgma-festival-canonical-smoke.yml'
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Smoke-test both official canonical domains without submitting personal data
        env:
          CGMA_ONE_TIME_WRITE_SMOKE: '1'
        run: node verify-festival-production.mjs
