name: Diagnose Auth Redirect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-auth-redirect.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public Supabase Auth settings
        shell: bash
        run: |
          set -euo pipefail
          url='https://renzehysxirjilvdxacv.supabase.co/auth/v1/settings'
          key='sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_'
          curl -fsS -H "apikey: $key" "$url" -o /tmp/settings.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/settings.json'))
          safe={
            'disable_signup': d.get('disable_signup'),
            'mailer_autoconfirm': d.get('mailer_autoconfirm'),
            'site_url': d.get('site_url'),
            'uri_allow_list': d.get('uri_allow_list'),
            'external': d.get('external'),
          }
          print(json.dumps(safe, ensure_ascii=False, indent=2))
          PY
