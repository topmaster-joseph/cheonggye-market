name: GitHub Pages Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static preview
        run: |
          set -euo pipefail
          mkdir -p _site
          find . -maxdepth 1 -type f ! -name '_redirects' ! -name '_headers' -exec cp {} _site/ \;
          mkdir -p _site/functions
          if [ -d functions ]; then cp -R functions/. _site/functions/; fi
          touch _site/.nojekyll
          cat > _site/preview.html <<'HTML'
          <!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>청계상권 AI 서비스 화면 확인</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 18px;line-height:1.7}a{display:block;padding:14px 16px;margin:10px 0;border:1px solid #ddd;border-radius:12px;text-decoration:none;color:#173b2c;background:#fff}small{color:#667}</style></head><body><h1>청계상권 AI 서비스 화면 확인</h1><p>Cloudflare 운영배포 전 각 정적 화면을 독립적으로 확인하는 검증용 페이지입니다.</p><a href="./index.html"><b>청계면상인회 홈페이지</b><small>index.html</small></a><a href="./market-ai.html"><b>청계상권 AI</b><small>market-ai.html</small></a><a href="./member.html"><b>정회원 · 내 가게</b><small>member.html</small></a><a href="./member-admin.html"><b>상인회 승인관리</b><small>member-admin.html</small></a><a href="./store-admin.html"><b>점주 운영관리</b><small>store-admin.html</small></a><a href="./order.html"><b>소비자 주문 화면</b><small>order.html</small></a><a href="./qr-print.html"><b>공용 QR 인쇄</b><small>qr-print.html</small></a></body></html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
