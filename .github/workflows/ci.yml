name: CGMA Auth CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate authentication scripts
        run: |
          node --check client.js
          node --check member.js
          node --check central-auth-bridge.js
          node --check site-shell.js
          node --check cgma-i18n.js
          node --check functions/_middleware.js
          node --check resources.js
          node --check resource-detail.js
          node --check admin-resources.js
          node --check admin-petition.js
          node --check functions/api/resources.js
          node --check functions/api/parking-petition.js
          node --check functions/_shared/resource-default-content.js
      - name: Verify canonical CGMA root contract
        run: |
          node verify-canonical.mjs
          node verify-domain-routing.mjs
      - name: Verify native official resource hub
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'OFFICIAL ARCHIVE' index.html
          grep -Fq 'id="resourceSearch"' index.html
          ! grep -Fq 'id="mapListToggle"' index.html
          grep -Fq 'class="map-center"' index.html
          grep -Fq 'cgma-sections.css?v=20260905-today-discovery-v5' index.html
          grep -Fq 'muan-map-art' script.js
          grep -Fq 'stick-person' script.js
          grep -Fq 'store-nearby' script.js
          grep -Fq 'shopRegistryIndex' script.js
          grep -Fq 'CGMA public store card v4' cgma-sections.css
          grep -Fq 'id="todayDiscovery"' index.html
          grep -Fq 'id="todayPickRefresh"' index.html
          grep -Fq 'renderTodayDiscovery' script.js
          grep -Fq 'revealRecommendedShop' script.js
          grep -Fq 'CGMA today discovery v5' cgma-sections.css
          grep -Fq 'store_public_profiles' script.js
          grep -Fq 'profileHero' store-admin.html
          grep -Fq "PROFILE_TABLE='store_public_profiles'" store-admin.js
          ! grep -Fq 'tile.openstreetmap.org' script.js
          ! grep -Fq 'Littly' index.html
          grep -Fq 'resource-detail.js' resource/index.html
          grep -Fq 'resource?id=' resources.js
          grep -Fq "if(type!=='internal'&&row.url)item.public_url" functions/api/resources.js
          grep -Fq 'parkingPetitionForm' resource-detail.js
          grep -Fq 'cgma_parking_petition' functions/api/parking-petition.js

      - name: Verify isolated customer authorization with central identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'EKODI 고객관리 | 청계면상인회' client/index.html
          grep -Fq 'script-src' client/index.html
          grep -Fq 'https://cdn.jsdelivr.net' client/index.html
          grep -Fq 'https://renzehysxirjilvdxacv.supabase.co' client/index.html
          grep -Fq 'EKODI 통합인증센터로 로그인' client/index.html
          grep -Fq 'https://auth.ekodi.kr/?site=cgma-client' client.js
          grep -Fq "const TENANT='cgma'" client.js
          grep -Fq "hash.get('ekodi_token')" client.js
          grep -Fq 'verifyOtp({token_hash:tokenHash' client.js
          grep -Fq '/api/customer/federated-login' client.js
          grep -Fq '/api/customer/accept-central-invite' client.js
          grep -Fq "new URL('/client/', url.origin)" functions/_middleware.js
          if grep -Fq '/api/customer/login' client.js || grep -Fq '/api/customer/accept-invite' client.js; then
            echo 'Legacy client password authentication detected'
            exit 1
          fi
          if grep -Eq 'innerHTML|insertAdjacentHTML|Math\.random' client.js; then
            echo 'Unsafe client portal rendering/token behavior detected'
            exit 1
          fi
      - name: Verify CGMA AI hostname route
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const isCgmaAiHost = host === 'cgma.ai.ekodi.kr';" functions/_middleware.js
          grep -Fq "new URL('/market-ai', url.origin)" functions/_middleware.js
      - name: Verify public homepage Google central login
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'data-central-auth' index.html
          grep -Fq 'data-site="cgma"' index.html
          grep -Fq 'Google 로그인' index.html
          grep -Fq 'Google로 계속하기' index.html
          grep -Fq 'https://auth.ekodi.kr/?site=cgma' index.html
          grep -Fq 'central-auth-bridge.js' index.html
          grep -Fq "const site=button?.dataset.site||'cgma'" central-auth-bridge.js
          grep -Fq "const MEMBER_APPLY=cgmaAbsolute('/member?apply=1')" central-auth-bridge.js
          grep -Fq 'Google 로그인만으로 무료회원' central-auth-bridge.js
          grep -Fq 'embedded.hidden=true' central-auth-bridge.js
          grep -Fq "hash.get('ekodi_token')" central-auth-bridge.js
          grep -Fq 'verifyOtp({token_hash:tokenHash' central-auth-bridge.js
          if grep -Fq 'data-provider="google"' index.html; then
            echo 'Legacy direct Google OAuth button detected on public homepage'
            exit 1
          fi
      - name: Verify native language and media adapter contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'name="google" content="notranslate"' index.html
          grep -Fq 'data-ekodi-header-home="cgma"' index.html
          grep -Fq 'data-ekodi-meeting-provider="jitsi"' index.html
          grep -Fq 'data-ekodi-media-provider="youtube"' index.html
          grep -Fq 'media-meeting-adapter.js' index.html
          grep -Fq 'cgma-i18n.js' index.html
          if grep -Fq 'translate.google.com' site-shell.js || grep -Fq 'googtrans=' site-shell.js; then
            echo 'Browser translation injection detected'
            exit 1
          fi

      - name: Verify EKODI central member access contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Google 무료 로그인' member/index.html
          grep -Fq 'id="googleLogin"' member/index.html
          grep -Fq 'id="accessCard"' member/index.html
          grep -Fq 'id="businessNumber"' member/index.html
          grep -Fq 'id="membershipConsent"' member/index.html
          grep -Fq '정회원 신청 제출' member/index.html
          grep -Fq '/member-auth.css' member/index.html
          grep -Fq "const SITE='cgma'" member.js
          grep -Fq 'https://auth.ekodi.kr/?site=' member.js
          grep -Fq 'functions/v1/access-api' member.js
          grep -Fq 'buildApplicationNote' member.js
          grep -Fq 'businessNumber' member.js
          grep -Fq "hash.get('ekodi_token')" member.js
          grep -Fq 'verifyOtp({token_hash:tokenHash' member.js
          grep -Fq 'history.replaceState' member.js
          grep -Fq '/me?site=' member.js
          grep -Fq "site:SITE,tenant:TENANT,role:'member'" member.js
          grep -Fq '/store">내 가게 관리' member/index.html
          grep -Fq '정회원 Marketing AI' member/index.html
          grep -Fq 'BASIC · 정회원 혜택 · 추가 월 구독료 0원' member/index.html
          grep -Fq 'Marketing AI Basic 열기' member/index.html
          grep -Fq '점포 전용 <b>*.ai.ekodi.kr</b>' member/index.html
          grep -Fq 'target.searchParams.set' member.js
          grep -Fq 'store:${id.toLowerCase()}' member.js
          grep -Fq "target.searchParams.set('site','marketing')" member.js
          grep -Fq "target.searchParams.set('return_to',MARKETING_RETURN)" member.js
          grep -Fq 'activeApprovedStoreName' member.js
          if grep -Fq 'signInWithOtp' member.js || grep -Fq 'signInWithOAuth' member.js; then
            echo 'Direct Supabase authentication detected in CGMA member flow'
            exit 1
          fi
          if grep -Fq '/store-admin">내 가게' member/index.html; then
            echo 'Legacy long store-admin link detected'
            exit 1
          fi
          if grep -Fq "ONBOARDING" member.js || grep -Fq "target_tenant:'ekodibiz'" member.js || grep -Fq 'id="copyMenu"' member/index.html; then
            echo 'Legacy one-off AI onboarding remains in CGMA member flow'
            exit 1
          fi
