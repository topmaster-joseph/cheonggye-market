name: EKODI Native KIPRIS Public Search Recon

on:
  pull_request:
    paths:
      - 'scripts/ekodi-kipris-native-recon.mjs'
      - '.github/workflows/ekodi-kipris-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly_kipris:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install isolated EKODI-owned browser
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify read-only native browser script syntax
        run: node --check scripts/ekodi-kipris-native-recon.mjs
      - name: Inspect KIPRIS public trademark UI
        run: node scripts/ekodi-kipris-native-recon.mjs
      - name: Preserve result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekodi-kipris-native-public-recon
          path: artifacts/kipris-native/
          if-no-files-found: warn
          retention-days: 7
