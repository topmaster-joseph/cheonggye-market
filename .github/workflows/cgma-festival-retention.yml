name: CGMA Festival Applicant Retention
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Require authorized retention DB access
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Delete expired festival applicant personal data
        run: |
          npx --yes wrangler@4.129.0 d1 execute cheonggye-market-notices --remote --command="DELETE FROM cgma_festival2026_applications WHERE date('now') >= '2027-01-28' AND event_id='cgma-du-dream-2026';"
