name: Fix Auth Redirect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-auth-redirect.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: renzehysxirjilvdxacv
    steps:
      - name: Verify management credential
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'SUPABASE_ACCESS_TOKEN is not configured in this repository.'
            exit 2
          fi
          echo 'Supabase management credential is configured.'

      - name: Configure production auth URLs
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"
          payload='{"site_url":"https://cgma.ekodi.kr","uri_allow_list":"https://cgma.ekodi.kr/member,https://cgma.ekodi.kr/member/**,https://cheonggye-market.pages.dev/member,https://cheonggye-market.pages.dev/member/**"}'
          code=$(curl -sS -o /tmp/auth.json -w '%{http_code}' -X PATCH "$api" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload")
          if [ "$code" != '200' ]; then
            python - <<'PY'
          import json
          try:
            d=json.load(open('/tmp/auth.json'))
            print({'message': d.get('message'), 'error': d.get('error')})
          except Exception:
            print('Supabase auth config update failed.')
          PY
            echo "Auth config update HTTP $code"
            exit 1
          fi
          python - <<'PY'
          import json
          d=json.load(open('/tmp/auth.json'))
          print('site_url=', d.get('site_url'))
          print('uri_allow_list=', d.get('uri_allow_list'))
          PY

      - name: Verify public auth settings endpoint
        shell: bash
        run: |
          set -euo pipefail
          url='https://renzehysxirjilvdxacv.supabase.co/auth/v1/settings'
          key='sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_'
          curl -fsS -H "apikey: $key" "$url" -o /tmp/settings.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/settings.json'))
          print('site_url=', d.get('site_url'))
          print('uri_allow_list=', d.get('uri_allow_list'))
          PY
