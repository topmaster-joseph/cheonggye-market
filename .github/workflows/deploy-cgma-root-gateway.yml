name: Deploy CGMA Root Gateway

on:
  push:
    branches: [main]
    paths:
      - 'cgma-root-gateway.js'
      - 'wrangler.cgma-root-gateway.toml'
      - 'verify-root-gateway.mjs'
      - '.github/workflows/deploy-cgma-root-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cgma-root-gateway-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate gateway contract
        run: |
          set -euo pipefail
          node --check cgma-root-gateway.js
          node verify-root-gateway.mjs
          node verify-canonical.mjs

      - name: Verify production account credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = '6986fd633f4e33bf804c921697b2d797'

      - name: Verify upstream before routing
        run: |
          set -euo pipefail
          curl -fsSL --max-redirs 6 --max-time 20 https://cheonggye-market.pages.dev/ | grep -Fq 'OFFICIAL ARCHIVE'
          curl -fsSL --max-redirs 6 --max-time 20 https://cheonggye-market.pages.dev/admin | grep -Fq 'ADMIN CONSOLE'
          curl -fsSL --max-redirs 6 --max-time 20 https://cheonggye-market.pages.dev/member-admin | grep -Fq 'MEMBERSHIP REVIEW'
          curl -fsSL --max-time 20 https://cheonggye-market.pages.dev/api/resources | grep -Fq '"items"'
      - name: Deploy canonical path gateway
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.cgma-root-gateway.toml
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify canonical production surfaces
        shell: bash
        run: |
          set -euo pipefail
          check_200() {
            path="$1"; needle="$2"
            for attempt in $(seq 1 18); do
              code=$(curl -sS -L --max-redirs 6 -D /tmp/cgma.headers -o /tmp/cgma.body -w '%{http_code}' --max-time 20 "https://ekodi.kr${path}?release=${GITHUB_SHA}" || true)
              if [[ "$code" == '200' ]] && grep -Fq "$needle" /tmp/cgma.body && grep -Fiq 'x-ekodi-route: cgma-root-gateway' /tmp/cgma.headers; then
                echo "OK ${path}"
                return 0
              fi
              sleep 4
            done
            echo "FAILED ${path} code=${code}"
            return 1
          }
          check_200 '/cgma' '청계면상인회 | 오늘도 청계에서 만나요'
          check_200 '/cgma/ai' '청계상권 AI | 청계면상인회'
          check_200 '/cgma/member' 'EKODI 통합인증센터'
          check_200 '/cgma/store' '내 가게 운영 | 청계상권 AI'
          check_200 '/cgma/admin' 'ADMIN CONSOLE'
          check_200 '/cgma/member-admin' 'MEMBERSHIP REVIEW'
          check_200 '/cgma/api/resources' '"items"'
          check_200 '/cgma/site-path.js' "prefix='/cgma'"

          code=$(curl -sS -D /tmp/cgma-auth.headers -o /tmp/cgma-auth.body -w '%{http_code}' --max-time 20 https://ekodi.kr/cgma/api/admin-session || true)
          test "$code" = '401'
          grep -Fiq 'x-ekodi-route: cgma-root-gateway' /tmp/cgma-auth.headers
          echo 'CGMA canonical root, subservices, admin surfaces, API and authorization boundary verified.'
