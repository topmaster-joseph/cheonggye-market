name: CGMA Root Gateway Source Gate

on:
  push:
    branches: [main]
    paths:
      - 'cgma-root-gateway.js'
      - 'wrangler.cgma-root-gateway.toml'
      - 'verify-root-gateway.mjs'
      - '.github/workflows/deploy-cgma-root-gateway.yml'
  pull_request:
    paths:
      - 'cgma-root-gateway.js'
      - 'wrangler.cgma-root-gateway.toml'
      - 'verify-root-gateway.mjs'
      - '.github/workflows/deploy-cgma-root-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cgma-root-gateway-source-gate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate gateway contract
        run: |
          set -euo pipefail
          node --check cgma-root-gateway.js
          node verify-root-gateway.mjs
          node verify-canonical.mjs
          npx --yes wrangler@4.129.0 deploy --dry-run --config wrangler.cgma-root-gateway.toml
      - name: Verify Pages upstream readiness
        shell: bash
        run: |
          set -euo pipefail
          check_upstream() {
            url="$1"; needle="$2"; body=$(mktemp)
            for attempt in $(seq 1 12); do
              if curl -fsSL --max-redirs 6 --max-time 20 -o "$body" "$url" && grep -Fq "$needle" "$body"; then
                rm -f "$body"
                return 0
              fi
              sleep 5
            done
            echo "Upstream not ready: $url"
            rm -f "$body"
            return 1
          }
          check_upstream 'https://cheonggye-market.pages.dev/' 'OFFICIAL ARCHIVE'
          check_upstream 'https://cheonggye-market.pages.dev/admin' 'id="memberReview"'
          check_upstream 'https://cheonggye-market.pages.dev/admin.html' 'id="memberReview"'
          check_upstream 'https://cheonggye-market.pages.dev/member-admin' 'MOVED TO ADMIN CONSOLE'
          check_upstream 'https://cheonggye-market.pages.dev/api/resources' '"items"'
          echo 'CGMA source and Pages upstream are ready. Production edge deployment is owned by ekodi-platform.'
