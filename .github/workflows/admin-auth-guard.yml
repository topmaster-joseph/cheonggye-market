name: CGMA Admin Auth Guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-admin-auth-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Verify canonical admin stays closed before authentication
        shell: bash
        run: |
          set -euo pipefail
          page=admin/index.html
          grep -Fq '[hidden]{display:none!important}' "$page"
          grep -Fq 'id="adminApp" class="admin-shell" hidden' "$page"
          grep -Fq 'id="adminLoginLink"' "$page"
          grep -Fq 'https://auth.ekodi.kr/?site=cgma&direct=1' "$page"
          grep -Fq "hash.get('ekodi_token')" "$page"
          grep -Fq 'verifyOtp({token_hash:tokenHash' "$page"
          grep -Fq "document.querySelector('#adminApp').hidden=true" "$page"
          grep -Fq 'id="memberReview"' "$page"
          grep -Fq 'CGMA_MEMBER_REVIEW' member-admin.js
          for bridge in admin.html member-admin.html member-admin/index.html; do
            echo "Checking compatibility bridge $bridge"
            grep -Fq 'MOVED TO' "$bridge"
            ! grep -Fq 'id="adminApp"' "$bridge"
            ! grep -Fq 'id="loginCard"' "$bridge"
          done
          echo 'CGMA single admin auth gate contract verified.'
