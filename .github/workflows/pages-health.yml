name: Cloudflare Pages Health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check whether production deployment is connected
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare credentials are not connected; public health verification is paused to avoid stale Direct Upload false alarms."
            {
              echo "## Cloudflare Pages health waiting"
              echo "The repository is ahead of the old Direct Upload deployment."
              echo "Health checks will resume automatically after Cloudflare repository secrets are connected."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Diagnose deployed files and redirects
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        env:
          BASE_URL: https://cheonggye-market.pages.dev
        run: |
          set -u
          diagnose() {
            local path="$1"
            echo "===== HEAD ${path} ====="
            curl -sSIL --max-time 15 "${BASE_URL}${path}" || true
            echo "===== TITLE/BODY ${path} ====="
            body="$(curl -sSL --max-time 15 "${BASE_URL}${path}" 2>&1 || true)"
            printf '%s' "$body" | grep -o '<title>[^<]*</title>' | head -1 || true
            printf '%s\n' "$body" | head -c 700 || true
            echo
          }
          diagnose "/"
          diagnose "/ai"
          diagnose "/market-ai.html"
          diagnose "/member"
          diagnose "/member.html"
          diagnose "/store-admin"
          diagnose "/store-admin.html"

      - name: Verify public routes
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        env:
          BASE_URL: https://cheonggye-market.pages.dev
        run: |
          set -euo pipefail
          check_route() {
            local path="$1"
            local expected="$2"
            local body=""
            for attempt in $(seq 1 5); do
              body="$(curl -fsSL --max-time 15 "${BASE_URL}${path}" 2>/dev/null || true)"
              if printf '%s' "$body" | grep -Fq "$expected"; then
                echo "OK ${path} contains: ${expected}"
                return 0
              fi
              echo "Retry ${attempt}/5: ${path} not ready"
              sleep 3
            done
            echo "FAILED ${path}: expected text not found: ${expected}"
            return 1
          }

          check_route "/" "청계면상인회 | 오늘도 청계에서 만나요"
          check_route "/ai" "청계상권 Marketing AI | 청계면상인회"
          check_route "/member" "회원 계정 · 정회원 신청 | 청계면상인회"
          check_route "/store-admin" "내 가게 운영 | 청계상권 AI"

      - name: Write health summary
        if: steps.credentials.outputs.configured == 'true' && success()
        run: |
          {
            echo "## Cloudflare Pages Health"
            echo "- / ✅"
            echo "- /ai ✅"
            echo "- /member ✅"
            echo "- /store-admin ✅"
          } >> "$GITHUB_STEP_SUMMARY"
