name: Import MNU poster asset (one-time)
on:
  push:
    branches:
      - feat/cgma-mnu-posters-20261106
    paths:
      - .github/workflows/import-mnu-poster-20261106.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify user-supplied recruitment poster
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p programs/mnu-accelerator-2026/assets
          curl --fail --location --retry 3 --max-time 45 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3IgFYuI0BG12rOdEtYmFORAqXKR/b8e8cb1d-5c48-4e16-a53e-19837a366a27.png' \
            -o programs/mnu-accelerator-2026/assets/mnu-main.png
          echo 'd15d3ba5c394751eea9c28527a10cece8df0f60cf761d56277ba094d02291dac  programs/mnu-accelerator-2026/assets/mnu-main.png' | sha256sum -c -
          test "$(wc -c < programs/mnu-accelerator-2026/assets/mnu-main.png)" -eq 2780288
      - name: Commit original to application repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EKODI image import'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programs/mnu-accelerator-2026/assets/mnu-main.png
          git diff --cached --quiet && exit 0
          git commit -m 'assets(cgma): add verified MNU recruitment poster'
          git push origin HEAD:feat/cgma-mnu-posters-20261106
