name: Temporary read-only motor festival live probe
on:
  push:
    branches: [claude/probe-motor-festival-live]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only GET probes (no data written)
        shell: bash
        run: |
          set +e +o pipefail
          probe() {
            local path="$1" needle="$2" code route loc hit
            code=$(curl -sS -L --max-redirs 6 -D h -o b -w '%{http_code}' --max-time 20 "https://ekodi.kr${path}" || true)
            route=$(grep -i '^x-ekodi-route:' h | tail -1 | tr -d '\r' | cut -c1-80)
            loc=$(grep -i '^location:' h | tail -1 | tr -d '\r' | cut -c1-120)
            hit=no; grep -Fq "$needle" b && hit=yes
            echo "::warning::PROBE ${path} code=${code} ${route} needle=${hit} ${loc} bytes=$(wc -c <b) head=$(head -c 120 b | tr -d '\n\r' | tr -c '[:print:]' ' ')"
          }
          probe '/cgma/motor-festival-2026/' 'id="apply"'
          probe '/cgma/motor-festival-2026/app.js' "const API='/api/merchant-events/motor-festival-2026/applications'"
          probe '/cgma/motor-festival-2026/admin/' 'id="refresh"'
          probe '/cgma/admin/assets/cgma-motor-festival-admin.js' 'mountCgmaMotorFestivalAdmin'
          probe '/cgma/admin/assets/cgma-member-admin.js' 'mountCgmaMemberAdmin'
          probe '/cgma/admin/festival' 'EKODI Workspace Admin'
          probe '/api/merchant-events/motor-festival-2026/applications' 'ADMIN_LOGIN_REQUIRED'
          probe '/cgma/board' '<title>게시판</title>'
          probe '/cgma/live/' 'id="hostButton"'
          probe '/cgma' '청계면상인회 | 오늘도 청계에서 만나요'
          probe '/cgma/admin' 'id="adminApp"'
          probe '/cgma/ai-education/' '우리 가게에 필요한 AI 교육을 찾아보세요'
          probe '/cgma/admin/member' 'EKODI Workspace Admin'
