name: Temporary motor festival live E2E (synthetic data only)
on:
  push:
    branches: [claude/probe-motor-festival-live]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Synthetic submit + negative cases (test row is deleted afterwards)
        shell: bash
        run: |
          set +e +o pipefail
          API='https://ekodi.kr/api/merchant-events/motor-festival-2026/applications'
          KEY="e2e-synthetic-$(date +%s)-${GITHUB_RUN_ID}"
          BODY='{"business_name":"[E2E 테스트] 가상상점","contact_name":"가상테스터","phone":"010-0000-0001","category":"기타","membership":"info","intent":"maybe","activity":["홍보"],"support":["테이블"],"hours":"am","staff":"1","items":"가상 품목","notes":"자동 실증용 가상 데이터 - 삭제 예정","consent":true}'
          post() { local label="$1"; shift; local code; code=$(curl -sS -o r.json -w '%{http_code}' --max-time 20 -X POST "$API" "$@"); echo "::warning::E2E ${label} code=${code} body=$(head -c 220 r.json | tr -d '\n\r')"; }
          H=(-H 'content-type: application/json' -H 'x-ekodi-intake-request: 1' -H 'origin: https://ekodi.kr')
          post cross-origin -H 'content-type: application/json' -H 'x-ekodi-intake-request: 1' -H 'origin: https://evil.example' -H "idempotency-key: ${KEY}x" --data "$BODY"
          post no-consent "${H[@]}" -H "idempotency-key: ${KEY}n" --data "${BODY/\"consent\":true/\"consent\":false}"
          post bad-phone "${H[@]}" -H "idempotency-key: ${KEY}p" --data "${BODY/010-0000-0001/abc}"
          post unknown-field "${H[@]}" -H "idempotency-key: ${KEY}u" --data "${BODY/\"consent\":true/\"consent\":true,\"x\":1}"
          post submit "${H[@]}" -H "idempotency-key: ${KEY}" --data "$BODY"
          post replay "${H[@]}" -H "idempotency-key: ${KEY}" --data "$BODY"
          code=$(curl -sS -o r.json -w '%{http_code}' --max-time 20 "$API?view=summary"); echo "::warning::E2E anon-summary code=${code} body=$(head -c 120 r.json)"
          code=$(curl -sS -o r.json -w '%{http_code}' --max-time 20 -H 'authorization: Bearer not-a-real-token' "$API"); echo "::warning::E2E bogus-token code=${code} body=$(head -c 120 r.json)"
