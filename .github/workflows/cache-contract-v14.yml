name: CGMA v14 cache contract helper

on:
  push:
    branches: [ai/chatgpt/cgma-v14-cache-bump]

permissions:
  contents: write

jobs:
  align-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ai/chatgpt/cgma-v14-cache-bump
      - name: Align cache contract
        run: |
          python - <<'PY'
          from pathlib import Path
          old='20260908-intervention-orchestrator-v13'
          new='20260908-outcome-evaluator-v14'
          for name in ['verify-canonical.mjs','.github/workflows/ci.yml']:
            p=Path(name)
            s=p.read_text(encoding='utf-8')
            if old not in s:
              raise SystemExit(f'missing {old} in {name}')
            p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          rm .github/workflows/cache-contract-v14.yml
      - name: Commit contract update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-canonical.mjs .github/workflows/ci.yml .github/workflows/cache-contract-v14.yml
          git commit -m "test: align CGMA v14 admin cache contract"
          git push origin HEAD:ai/chatgpt/cgma-v14-cache-bump
# trigger: align-v14-contract-v2
