name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Cloudflare deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deployment is waiting for CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            {
              echo "## Cloudflare Pages deployment waiting"
              echo "GitHub main is ready, but Cloudflare credentials are not connected to this repository yet."
              echo "No deployment was attempted."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy current main to existing Pages project
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=cheonggye-market --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify deployed routes
        if: steps.credentials.outputs.configured == 'true'
        env:
          BASE_URL: https://cheonggye-market.pages.dev
        run: |
          set -euo pipefail
          check_route() {
            local path="$1"
            local expected="$2"
            for attempt in $(seq 1 20); do
              body="$(curl -fsSL --max-time 15 "${BASE_URL}${path}" 2>/dev/null || true)"
              if printf '%s' "$body" | grep -Fq "$expected"; then
                echo "OK ${path}"
                return 0
              fi
              sleep 5
            done
            echo "Deployment verification failed: ${path}"
            return 1
          }
          check_route "/" "청계면상인회 | 오늘도 청계에서 만나요"
          check_route "/ai" "청계상권 AI | 청계면상인회"
          check_route "/member" "정회원 내 가게 | 청계면상인회"
          check_route "/store-admin" "내 가게 운영 | 청계상권 AI"
