name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.credentials.outputs.configured }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate canonical CGMA root contract
        run: |
          node verify-canonical.mjs
          node verify-domain-routing.mjs

      - name: Validate mobile fixed-header contract
        run: |
          set -euo pipefail
          grep -Fq 'position:fixed!important' responsive.css
          grep -Fq 'safe-area-inset-top' responsive.css
          grep -Fq 'body:has(>.topbar),body:has(>.top)' responsive.css
          grep -Fq 'data-ekodi-fixed-header' admin/index.html
          grep -Fq 'position:fixed' admin/index.html
          grep -Fq 'safe-area-inset-top' admin/index.html
          grep -Fq 'MOVED TO CANONICAL ADMIN' admin.html
          ! grep -Fq 'id="adminApp"' admin.html

      - name: Check Cloudflare deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deployment is waiting for CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            {
              echo "## Cloudflare Pages deployment waiting"
              echo "GitHub main is ready, but Cloudflare credentials are not connected to this repository yet."
              echo "No deployment was attempted."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy current main to existing Pages project
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=cheonggye-market --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Diagnose public festival readiness without exposing applicant data
        if: steps.credentials.outputs.configured == 'true'
        run: |
          set -euo pipefail
          echo 'Public festival API status (no private records):'
          curl -sS --max-time 15 -w '\\nHTTP_STATUS=%{http_code}\\n' https://cheonggye-market.pages.dev/api/festival-booths | head -c 650
          echo
      - name: Verify deployed routes and mobile fixed headers
        if: steps.credentials.outputs.configured == 'true'
        env:
          BASE_URL: https://cheonggye-market.pages.dev
        run: |
          set -euo pipefail
          check_route() {
            local base="$1"
            local path="$2"
            local expected="$3"
            for attempt in $(seq 1 20); do
              sep="?"; [[ "$path" == *"?"* ]] && sep="&"
              body="$(curl -fsSL --max-time 15 "${base}${path}${sep}release=${GITHUB_SHA}" 2>/dev/null || true)"
              if grep -Fq "$expected" <<< "$body"; then
                echo "OK ${base}${path}"
                return 0
              fi
              sleep 5
            done
            echo "Deployment verification failed: ${base}${path}"
            return 1
          }
          check_css() {
            local base="$1"
            for attempt in $(seq 1 20); do
              body="$(curl -fsSL --max-time 15 "${base}/responsive.css?release=${GITHUB_SHA}" 2>/dev/null || true)"
              if grep -Fq 'position:fixed!important' <<< "$body" \
                && grep -Fq 'body:has(>.topbar),body:has(>.top)' <<< "$body" \
                && grep -Fq 'safe-area-inset-top' <<< "$body"; then
                echo "OK ${base}/responsive.css fixed-header contract"
                return 0
              fi
              sleep 5
            done
            echo "Fixed-header CSS verification failed: ${base}/responsive.css"
            return 1
          }
          check_route "$BASE_URL" "/" "청계면상인회 | 오늘도 청계에서 만나요"
          check_route "$BASE_URL" "/" 'id="scheduleApp"'
          check_route "$BASE_URL" "/schedule-board.js" "window.CGMA_SCHEDULE"
          check_route "$BASE_URL" "/schedule-board.css" ".schedule-grid .schedule-day{"
          check_route "$BASE_URL" "/" 'property="og:image"'
          check_route "$BASE_URL" "/" '<link rel="canonical" href="https://cgma.or.kr/">'
          check_route "$BASE_URL" "/robots.txt" "Sitemap: https://cgma.or.kr/sitemap.xml"
          check_route "$BASE_URL" "/sitemap.xml" "<loc>https://cgma.or.kr/</loc>"
          check_route "$BASE_URL" "/api/schedule?upcoming=3" '"upcoming":'
          check_route "$BASE_URL" "/ai-education/" "우리 가게에 필요한 AI 교육을 찾아보세요"
          check_route "$BASE_URL" "/programs/ai-marketing-2026/" 'href="./manage/"'
          # The logged-out roster login is now present in HTML before JavaScript runs.
          check_route "$BASE_URL" "/programs/ai-marketing-2026/manage/" 'id="manage" class="manage" aria-label'
          check_route "$BASE_URL" "/programs/ai-marketing-2026/manage/" 'id="cgma-roster-login"'
          # Public applicant pages show Google login by default and logout only after auth.
          check_route "$BASE_URL" "/programs/ai-marketing-2026/" 'id="ai-edu-login"'
          check_route "$BASE_URL" "/programs/ai-marketing-2026/" 'id="ai-edu-logout" hidden'
          check_route "$BASE_URL" "/programs/ai-marketing-2026/manage/" 'noindex,nofollow,noarchive'
          check_route "$BASE_URL" "/programs/ai-marketing-2026/manage/app.js" "cgma_ai_edu_2026_admin_list"
          check_route "$BASE_URL" "/cgma-programs.js" "whenAuthReady:()=>authReady"
          # Fail closed when any deployed login surface still points at a retired auth subdomain.
          # Verify both the Pages upstream and the actual ekodi.kr/cgma public gateway.
          check_auth_entry() {
            local url="$1" expected="$2" body
            for attempt in $(seq 1 12); do
              body="$(curl -fsSL --max-time 15 "${url}?release=${GITHUB_SHA}&auth_check=${attempt}" 2>/dev/null || true)"
              if [[ "$body" == *"$expected"* ]] && [[ "$body" != *"auth.ekodi.kr"* ]]; then
                echo "OK canonical login entry: ${url}"
                return 0
              fi
              sleep 5
            done
            echo "::error::Canonical EKODI login entry was not verified: ${url}"
            return 1
          }
          for site_base in "$BASE_URL" "https://ekodi.kr/cgma"; do
            check_auth_entry "$site_base/programs/ai-marketing-2026/manage/" 'href="https://ekodi.kr/auth/?site=cgma&amp;direct=1&amp;return_to='
            check_auth_entry "$site_base/programs/ai-marketing-2026/" 'href="https://ekodi.kr/auth/?site=cgma&amp;direct=1&amp;return_to='
            check_auth_entry "$site_base/programs/ai-marketing-2026/app.js" "entry.href='https://ekodi.kr/auth/?site=cgma&direct=1&return_to='"
            check_auth_entry "$site_base/cgma-programs.js" "return 'https://ekodi.kr/auth/?site=cgma&direct=1&return_to='"
            # Homepage, member, client, schedule and bridge logins were still on the
            # retired host (unreachable as of 2026-10-31); keep them on the hub too.
            check_auth_entry "$site_base/" 'href="https://ekodi.kr/auth/?site=cgma&amp;direct=1'
            check_auth_entry "$site_base/central-auth-bridge.js" 'https://ekodi.kr/auth/?site='
            check_auth_entry "$site_base/member.js" 'https://ekodi.kr/auth/?site='
            check_auth_entry "$site_base/client.js" 'https://ekodi.kr/auth/?site=cgma-client'
            check_auth_entry "$site_base/schedule-board.js" "https://ekodi.kr/auth/?site=cgma&direct=1&return_to="
          done
          check_route "$BASE_URL" "/ai-education/" "cgma-inline-management.js"
          check_route "$BASE_URL" "/cgma-inline-management.js" "sessionStorageKey='sb-renzehysxirjilvdxacv-auth-token'"
          check_route "$BASE_URL" "/ai-education/app.js" "const questions = ["
          check_route "$BASE_URL" "/ai-education/questions.mjs" "export const SURVEY_QUESTIONS"
          check_route "$BASE_URL" "/ai-education/report/" "AI 교육 수요조사 통계"
          check_route "$BASE_URL" "/ai-education/report/app.js" "document.getElementById('charts')"
          check_route "$BASE_URL" "/admin" "educationSurveyManager"
          # Anonymous response intake must not expose admin aggregates.
          stats_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$BASE_URL/api/ai-education-stats" || true)"
          test "$stats_code" = '401' || { echo "CGMA survey stats must reject unauthenticated requests: $stats_code"; exit 1; }
          check_route "$BASE_URL" "/ai" "청계상권 Marketing AI | 현재 비활성화"
          check_route "$BASE_URL" "/member" "회원 계정 · 정회원 신청 | 청계면상인회"
          check_route "$BASE_URL" "/store" "내 가게 운영 | 청계상권 AI"
          check_route "$BASE_URL" "/admin" "data-ekodi-fixed-header"
          check_route "$BASE_URL" "/admin.html" "data-ekodi-fixed-header"
          check_route "$BASE_URL" "/member-admin" "MOVED TO ADMIN CONSOLE"
          check_route "$BASE_URL" "/admin/" 'id="ipArchive"'
          check_route "$BASE_URL" "/admin-ip-archive.js" "CGMA_IP_ARCHIVE"
          check_route "$BASE_URL" "/admin-ip-sharing.js" "CGMA_IP_SHARING"
          check_route "$BASE_URL" "/ip-share/" 'noindex,nofollow,noarchive'
          for api_path in "/api/ip-shares" "/api/ip-share?token=invalid"; do
            expect_code="401"; [[ "$api_path" == *"token=invalid"* ]] && expect_code="404"
            share_response="$(mktemp)"
            share_code="$(curl -sS --max-time 15 -o "$share_response" -w '%{http_code}' "$BASE_URL$api_path")"
            if [ "$share_code" != "$expect_code" ] || grep -Eq 'drive\\.google\\.com|@example\\.org' "$share_response"; then
              echo "::error::CGMA public IP share endpoint leaked data: $api_path (HTTP $share_code)"
              rm -f "$share_response"
              exit 1
            fi
            rm -f "$share_response"
          done
          echo "OK admin-only share management and invalid public token isolation"
          # Public requests must be denied before the private Drive links can be serialized.
          ip_archive_body="$(mktemp)"
          ip_archive_status="$(curl -sS --max-time 15 -o "$ip_archive_body" -w '%{http_code}' "$BASE_URL/api/ip-archive")"
          if [ "$ip_archive_status" != "401" ] || grep -Eq 'drive\\.google\\.com|1L8vAKX_' "$ip_archive_body"; then
            echo "::error::CGMA private IP archive failed public authorization isolation"
            rm -f "$ip_archive_body"
            exit 1
          fi
          rm -f "$ip_archive_body"
          echo "OK admin-only archive API denies public access"
          check_route "$BASE_URL" "/api/resources" "items"
          check_route "$BASE_URL" "/resource/" "resource-detail.js"
          check_route "$BASE_URL" "/mascot/" "청깨비의 이야기"
          check_route "$BASE_URL" "/mascot/" "저작재산권 귀속"
          check_route "$BASE_URL" "/resources.js" "청깨비 · 청계거리 공식 마스코트"
          check_route "$BASE_URL" "/" "청깨비 만나기"
          check_route "$BASE_URL" "/api/resources?id=support-plan" "총사업비는 1억원"
          check_route "$BASE_URL" "/api/resources?id=urban-brief-2024" "312억원"
          check_route "$BASE_URL" "/api/parking-petition" "count"
          check_route "$BASE_URL" "/festival/2026/apply/" "참여부스 온라인 신청"
          check_route "$BASE_URL" "/festival/2026/coupon/" "쿠폰 사용 가능 상가 참여 신청서"
          # Official uploaded promotional images must be served as actual bytes, not HTML error fallbacks.
          verify_festival_asset() {
            local relative="$1" expected_sha="$2"
            local file actual_sha
            file="$(mktemp)"
            # Pages/CDN can briefly serve stale fallback content immediately after deployment.
            # Retry against a release-scoped URL, but fail closed if exact bytes do not arrive.
            for attempt in 1 2 3 4 5 6; do
              if curl -fsSL --max-time 15 "${BASE_URL}/festival/2026/assets/${relative}?release=${GITHUB_SHA}&attempt=${attempt}" -o "$file"; then
                actual_sha="$(sha256sum "$file" | awk '{print $1}')"
                if [[ "$actual_sha" == "$expected_sha" ]]; then
                  rm -f "$file"
                  echo "OK official festival image: $relative (attempt $attempt)"
                  return 0
                fi
              fi
              echo "Waiting for exact official image bytes: $relative (attempt $attempt)"
              sleep 5
            done
            rm -f "$file"
            echo "Official festival image checksum mismatch after retries: $relative"
            return 1
          }
          verify_festival_asset "du-dream-2026-official-poster.webp" "4cd6eab680f3e8b887e009737661c6f6493fe8347a8c731eb7450d545bd95336"
          verify_festival_asset "du-dream-2026-traffic-overview.webp" "07bd92387a4a98119a7e561c58d0e8e7b85387b7276f10e509ecf78375853077"
          verify_festival_asset "du-dream-2026-traffic-detail.webp" "39eb2ac7b9a47cbdb9855685c74b62353827e1b146ec7d739bcab59df3ff651b"
          verify_festival_asset "cardnews-booth.webp" "9d54177fc4b67a3a7d9a9b4a8a8fbbe9ab9b0ca23e80e37fb2599d31965f34a1"
          verify_festival_asset "cardnews-program.webp" "c826d74fa199e8031ffd6eb2b4c4aa05edd6a559d8587c975869de63d60601e9"
          verify_festival_asset "cardnews-coupon.webp" "53049b3d821e230c41df1e710e7af174590f049692d5c61222c2d35f499a9783"
          check_route "$BASE_URL" "/festival/2026/apply/" "cgma-festival-intake"
          check_route "$BASE_URL" "/festival/2026/coupon/" "cgma-festival-intake"
          edge_status="$(curl -fsS --max-time 15 -H 'Origin: https://cgma.or.kr' -H 'apikey: sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_' 'https://renzehysxirjilvdxacv.supabase.co/functions/v1/cgma-festival-intake/status')"
          grep -Fq '"ok":true' <<< "$edge_status"
          grep -Fq '"couponValue":5000' <<< "$edge_status"
          echo 'OK EKODI production festival and coupon Edge backend'

          check_route "$BASE_URL" "/admin" "festivalManager"
          public_resources="$(curl -fsSL --max-time 15 "${BASE_URL}/api/resources?release=${GITHUB_SHA}")"
          if grep -Eq 'drive\.google\.com|docs\.google\.com' <<< "$public_resources"; then echo 'Public Google source URL leaked'; exit 1; fi
          check_route "$BASE_URL" "/" "OFFICIAL ARCHIVE"
          check_route "$BASE_URL" "/cgma-sections.css" "CGMA map + archive readability redesign"
          check_css "$BASE_URL"
          echo 'Cheonggye public, AI, member, store and admin surfaces verified with fixed mobile header contract.'


  native_surface_verification_desktop:
    name: EKODI Native CGMA Surface Verification · Desktop
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    uses: topmaster-joseph/ekodi-platform/.github/workflows/ekodi-background-browser-worker.yml@main
    with:
      surface_paths: /cgma/,/cgma/notices/1,/cgma/ai-education/,/cgma/festival/2026/apply/,/cgma/festival/2026/coupon/
      device_profile: desktop

  native_surface_verification_mobile:
    name: EKODI Native CGMA Surface Verification · Mobile
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    uses: topmaster-joseph/ekodi-platform/.github/workflows/ekodi-background-browser-worker.yml@main
    with:
      surface_paths: /cgma/,/cgma/notices/1,/cgma/ai-education/,/cgma/festival/2026/apply/,/cgma/festival/2026/coupon/
      device_profile: mobile-portrait
