name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate canonical CGMA root contract
        run: |
          node verify-canonical.mjs
          node verify-domain-routing.mjs

      - name: Validate mobile fixed-header contract
        run: |
          set -euo pipefail
          grep -Fq 'position:fixed!important' responsive.css
          grep -Fq 'safe-area-inset-top' responsive.css
          grep -Fq 'body:has(>.topbar),body:has(>.top)' responsive.css
          grep -Fq 'data-ekodi-fixed-header' admin.html
          grep -Fq 'position:fixed' admin.html
          grep -Fq 'safe-area-inset-top' admin.html

      - name: Check Cloudflare deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deployment is waiting for CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            {
              echo "## Cloudflare Pages deployment waiting"
              echo "GitHub main is ready, but Cloudflare credentials are not connected to this repository yet."
              echo "No deployment was attempted."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy current main to existing Pages project
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=cheonggye-market --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify deployed routes and mobile fixed headers
        if: steps.credentials.outputs.configured == 'true'
        env:
          BASE_URL: https://cheonggye-market.pages.dev
        run: |
          set -euo pipefail
          check_route() {
            local base="$1"
            local path="$2"
            local expected="$3"
            for attempt in $(seq 1 20); do
              sep="?"; [[ "$path" == *"?"* ]] && sep="&"
              body="$(curl -fsSL --max-time 15 "${base}${path}${sep}release=${GITHUB_SHA}" 2>/dev/null || true)"
              if printf '%s' "$body" | grep -Fq "$expected"; then
                echo "OK ${base}${path}"
                return 0
              fi
              sleep 5
            done
            echo "Deployment verification failed: ${base}${path}"
            return 1
          }
          check_css() {
            local base="$1"
            for attempt in $(seq 1 20); do
              body="$(curl -fsSL --max-time 15 "${base}/responsive.css?release=${GITHUB_SHA}" 2>/dev/null || true)"
              if printf '%s' "$body" | grep -Fq 'position:fixed!important' \
                && printf '%s' "$body" | grep -Fq 'body:has(>.topbar),body:has(>.top)' \
                && printf '%s' "$body" | grep -Fq 'safe-area-inset-top'; then
                echo "OK ${base}/responsive.css fixed-header contract"
                return 0
              fi
              sleep 5
            done
            echo "Fixed-header CSS verification failed: ${base}/responsive.css"
            return 1
          }
          check_route "$BASE_URL" "/" "청계면상인회 | 오늘도 청계에서 만나요"
          check_route "$BASE_URL" "/ai" "청계상권 Marketing AI | 현재 비활성화"
          check_route "$BASE_URL" "/member" "회원 계정 · 정회원 신청 | 청계면상인회"
          check_route "$BASE_URL" "/store" "내 가게 운영 | 청계상권 AI"
          check_route "$BASE_URL" "/admin.html" "data-ekodi-fixed-header"
          check_route "$BASE_URL" "/api/resources" "items"
          check_route "$BASE_URL" "/resource/" "resource-detail.js"
          check_route "$BASE_URL" "/api/resources?id=support-plan" "총사업비는 1억원"
          check_route "$BASE_URL" "/api/resources?id=urban-brief-2024" "312억원"
          check_route "$BASE_URL" "/api/parking-petition" "count"
          public_resources="$(curl -fsSL --max-time 15 "${BASE_URL}/api/resources?release=${GITHUB_SHA}")"
          if printf '%s' "$public_resources" | grep -Eq 'drive\.google\.com|docs\.google\.com'; then echo 'Public Google source URL leaked'; exit 1; fi
          check_route "$BASE_URL" "/" "OFFICIAL ARCHIVE"
          check_route "$BASE_URL" "/cgma-sections.css" "CGMA map + archive readability redesign"
          check_css "$BASE_URL"
          echo 'Cheonggye public, AI, member, store and admin surfaces verified with fixed mobile header contract.'
