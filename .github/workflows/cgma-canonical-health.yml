name: CGMA Canonical Health

on:
  push:
    branches:
      - main
    paths:
      - 'verify-canonical-production.mjs'
      - '.github/workflows/cgma-canonical-health.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cgma-canonical-health
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify canonical production matrix
        run: node verify-canonical-production.mjs
      - name: Verify 2026 festival and coupon canonical signup readiness
        env:
          CGMA_VERIFY_OFFICIAL_IMAGES: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: node verify-festival-production.mjs
