<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>쿠폰 사용 가능 상가 공유 명단 | 청계면상인회</title>
<link rel="stylesheet" href="../admin/admin.css?v=20261023-coupon-admin-v1">
<style>
.share-top{padding:20px 0 6px}.share-top small{display:block;color:var(--muted);font-weight:700}
.share-top h1{margin:4px 0;font-size:clamp(20px,5.2vw,28px)}
.share-note{font-size:13px;color:var(--muted);margin:4px 0 12px}
.pwform{max-width:420px}
.vrows{display:flex;flex-direction:column;gap:8px}
.vrow{padding:12px;background:#fff;border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
.vrow .field{font-size:14px;overflow-wrap:anywhere}.vrow .field .k{display:inline-block;min-width:4.5em;margin-right:6px;color:var(--muted);font-size:12px;font-weight:700}
.vrow .first{font-weight:800;font-size:16px}
@media(min-width:900px){
  .vrow,.vhead{grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:10px}
  .vrow .field .k{display:none}.vrow .first{font-size:15px}
  .vhead{display:grid;padding:0 13px;font-size:12px;font-weight:800;color:var(--muted)}
}
@media(max-width:899px){.vhead{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="share-top" role="banner">
    <small>청계면상인회 · 2026 청계 누구나 두:드림 축제</small>
    <h1 id="title">쿠폰 사용 가능 상가 공유 명단</h1>
    <p class="share-note" id="meta">읽기 전용 공유 화면입니다.</p>
  </div>
  <p id="status" class="status" role="status" aria-live="polite">공유 링크를 확인하고 있습니다.</p>
  <form id="pwForm" class="card pwform" hidden>
    <label>이 공유 명단의 비밀번호<input id="pw" type="password" autocomplete="current-password" maxlength="200" required></label>
    <div class="btnrow"><button class="primary" type="submit">열기</button></div>
  </form>
  <section id="view" hidden>
    <div class="toolbar"><label class="grow"><span class="sr">검색</span><input id="q" type="search" placeholder="명단 안에서 검색" autocomplete="off"></label></div>
    <div class="btnrow" id="downloads" hidden><button type="button" data-download="xlsx">Excel 다운로드</button><button type="button" data-download="csv">CSV 다운로드</button></div>
    <div id="rows" class="vrows"></div>
    <p class="share-note">이 명단은 청계면상인회가 선택한 항목만 담고 있으며, 정해진 목적 외 사용·재배포를 금지합니다. 링크는 만료되거나 폐기되면 열리지 않습니다.</p>
  </section>
</div>
<script type="module" src="./share.mjs?v=20261023-coupon-share-v1"></script>
</body>
</html>
