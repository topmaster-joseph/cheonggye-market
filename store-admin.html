<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="robots" content="noindex,nofollow"/><title>내 가게 운영 | 청계상권 AI</title><link rel="stylesheet" href="/store-admin.css?v=20260811"/></head>
<body>
<header class="top"><a href="/member">← 정회원 · 내 가게</a><div class="row"><select id="storeSelect" class="store-select hide" aria-label="관리할 점포"></select><button id="refresh" class="ghost hide">새로고침</button><button id="logout" class="secondary hide">로그아웃</button></div></header>
<main class="wrap">
  <section class="hero"><span class="kicker">MY STORE</span><h1>내 가게 운영</h1><p class="muted">점포별 주문·메뉴·QR을 한 화면에서 관리합니다. 이 화면의 주문·결제정보는 상인회 전체 관리자가 아니라 점포 권한이 있는 사용자에게만 열립니다.</p></section>
  <section id="loginCard" class="card login"><h2>간편 로그인</h2><p class="muted">정회원 점포 승인에 사용한 이메일로 로그인하세요.</p><label for="email">이메일</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"/><div class="row" style="margin-top:10px"><button id="sendLink">로그인 링크 받기</button></div><div id="loginStatus" class="status hide"></div></section>
  <div id="app" class="hide">
    <section class="card"><div class="section-title"><div><span class="kicker">STORE STATUS</span><h2 id="storeName">점포</h2></div><span id="orderBadge" class="badge">주문 OFF</span></div><p id="storeAddress" class="muted"></p><div class="stats"><div class="stat"><small>오늘 주문</small><strong id="todayOrders">0</strong></div><div class="stat"><small>결제완료</small><strong id="paidOrders">0</strong></div><div class="stat"><small>준비중</small><strong id="activeOrders">0</strong></div><div class="stat"><small>메뉴</small><strong id="menuCount">0</strong></div></div><div id="storeStatus" class="status" style="margin-top:12px"></div><div class="row" style="margin-top:12px"><button id="toggleOrdering">주문 켜기</button><a id="openOrder" class="button secondary hide" target="_blank" rel="noopener">주문 화면 열기</a></div><div id="qrBox" class="qrbox hide" style="margin-top:10px"></div></section>

    <section class="card"><div class="section-title"><h2>메뉴 관리</h2><button id="newMenu" class="secondary">새 메뉴</button></div><div id="menuForm" class="hide"><div class="grid"><div><label for="menuName">메뉴명</label><input id="menuName" maxlength="200"/></div><div><label for="menuPrice">가격</label><input id="menuPrice" type="number" min="0" step="100" inputmode="numeric"/></div></div><label for="menuDescription">설명 <span class="muted">선택</span></label><textarea id="menuDescription"></textarea><div class="row"><label style="margin:0"><input id="menuAvailable" type="checkbox" checked style="width:auto"/> 주문 가능</label><button id="saveMenu">저장</button><button id="cancelMenu" class="secondary">취소</button></div><div id="menuStatus" class="status hide"></div></div><div id="menuList" class="menu-list"></div></section>

    <section class="card"><div class="section-title"><h2>최근 주문</h2><span class="muted">최근 100건</span></div><div id="orders" class="orders"></div></section>
  </div>
</main>
<footer class="footer">점포 운영자 전용 · Powered by Marketing AI Core</footer>
<script type="module" src="/store-admin.js?v=20260811"></script></body></html>
