<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>관리자 | 청계면상인회</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="styles.css">
  <style>
    body{background:#f5f0e5}.admin-shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.admin-side{background:#143f35;color:#fff;padding:2rem}.admin-side a{display:block;margin-bottom:2.5rem}.admin-side nav button{display:block;width:100%;padding:.85rem 0;border:0;border-bottom:1px solid #416b61;background:transparent;color:#fff;text-align:left;font:inherit}.admin-main{padding:3rem 5vw}.admin-main h1{font-size:clamp(2.4rem,5vw,4rem);margin:.5rem 0}.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:2rem}.admin-card{background:#fff;padding:1.5rem;min-height:170px;border-top:4px solid #ff6038}.admin-card b{font-size:2rem}.access-state{padding:1rem;background:#fff;border-left:4px solid #d7f04a}.denied{max-width:640px;margin:12vh auto;background:#fff;padding:3rem;text-align:center}.denied a{display:inline-block;margin-top:1rem;padding:.8rem 1.3rem;border-radius:99px;background:#143f35;color:#fff}@media(max-width:800px){.admin-shell{display:block;padding-top:calc(70px + env(safe-area-inset-top,0px))}.admin-side{position:fixed;top:0;left:0;right:0;width:100%;height:calc(70px + env(safe-area-inset-top,0px));z-index:1200;padding:calc(14px + env(safe-area-inset-top,0px)) 1.2rem 10px;box-sizing:border-box;display:flex;align-items:center}.admin-side a{margin:0}.admin-side nav{display:none}.admin-grid{grid-template-columns:1fr}.admin-main{padding:2rem 1.2rem}}
  </style>
</head>
<body>
  <div id="adminLoading" class="denied"><h1>권한 확인 중</h1><p>로그인 정보와 관리자 등급을 안전하게 확인하고 있습니다.</p></div>
  <div id="adminDenied" class="denied" hidden><h1>관리자 전용 페이지입니다</h1><p id="deniedMessage">관리자 또는 운영진 등급으로 로그인해야 볼 수 있습니다.</p><a href="index.html#login">로그인 화면으로</a></div>
  <div id="adminApp" class="admin-shell" hidden>
    <aside class="admin-side" data-ekodi-fixed-header><a href="index.html"><b>청계면상인회</b><br><small>ADMIN CONSOLE</small></a><nav><button>대시보드</button><button>회원 등급 관리</button><button>상권소식 검토</button><button>행사·회의 관리</button></nav></aside>
    <main class="admin-main"><span>MANAGEMENT</span><h1>관리자 대시보드</h1><p class="access-state" id="accessState"></p><section class="admin-grid"><article class="admin-card"><span>정회원</span><br><b>51</b><p>Google Drive 최신 명단 기준</p></article><article class="admin-card"><span>소식 수집</span><br><b>자동</b><p>상권·지역·대학 소식 30분 캐시</p></article><article class="admin-card"><span>온라인 회의</span><br><b>Jitsi</b><p>상인회 실시간 회의실 연결</p></article></section></main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const client=window.supabase.createClient('https://renzehysxirjilvdxacv.supabase.co','sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_');
    (async()=>{
      const {data}=await client.auth.getSession();
      const token=data.session?.access_token;
      if(!token)return deny('로그인 후 다시 시도해 주세요.');
      try{
        const response=await fetch('/api/admin-session',{headers:{Authorization:`Bearer ${token}`}});
        const result=await response.json();
        if(!response.ok||!result.allowed)return deny('현재 회원 등급에는 관리자 페이지 열람 권한이 없습니다.');
        document.querySelector('#adminLoading').hidden=true;
        document.querySelector('#adminApp').hidden=false;
        document.querySelector('#accessState').textContent=result.mode==='edit'?'최고관리자 · 조회 및 수정 가능':'운영진 · 조회 가능';
      }catch{return deny('권한 확인 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.')}
    })();
    function deny(message){document.querySelector('#adminLoading').hidden=true;document.querySelector('#adminDenied').hidden=false;document.querySelector('#deniedMessage').textContent=message}
  </script>
</body>
</html>
