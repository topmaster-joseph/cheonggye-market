<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>청계상권 AI QR 인쇄 | 청계면상인회</title>
  <style>
    :root{--ink:#172019;--muted:#667069;--paper:#f4f1e7;--green:#1b6843;--line:#d6dbd4}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,system-ui,-apple-system,"Segoe UI",sans-serif;word-break:keep-all;overflow-wrap:break-word}.wrap{width:min(760px,calc(100% - 24px));margin:30px auto}.sheet{background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;text-align:center;box-shadow:0 16px 44px rgba(25,46,32,.07)}.kicker{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--green)}h1{font-size:clamp(30px,7vw,52px);line-height:1.04;margin:12px 0;text-wrap:balance}p{color:var(--muted);line-height:1.65;text-wrap:pretty}.qr{width:320px;height:320px;max-width:80vw;margin:26px auto;padding:18px;background:#fff;border:1px solid var(--line);border-radius:18px;display:grid;place-items:center}.qr canvas{width:100%!important;height:auto!important}.url{font-size:12px;overflow-wrap:anywhere;word-break:normal;background:#f6f7f4;border-radius:10px;padding:10px;margin:16px auto;max-width:560px}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:18px}.actions button,.actions a{border:0;border-radius:11px;padding:12px 16px;font:inherit;font-weight:850;text-decoration:none;cursor:pointer;background:var(--green);color:#fff;word-break:keep-all}.actions a{background:#e9eee9;color:var(--ink)}.note{font-size:12px}.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;font-weight:900;font-size:22px}.brand b{font-size:19px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em}@media print{body{background:#fff}.wrap{width:100%;margin:0}.sheet{box-shadow:none;border:0;border-radius:0;padding:18mm 12mm}.actions,.note{display:none}.qr{width:86mm;height:86mm}.url{border:0;background:#fff}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="sheet">
      <div class="brand"><span class="mark">청</span><span><b>청계면상인회</b><small>CHEONGGYE MERCHANTS</small></span></div>
      <div class="kicker">CHEONGGYE LOCAL COMMERCE</div>
      <h1>청계상권 AI</h1>
      <p>QR을 스캔하면 청계의 가게를 찾고<br>메뉴와 주문 가능한 매장을 바로 확인할 수 있습니다.</p>
      <div id="qrcode" class="qr" aria-label="청계상권 AI 공용 QR"></div>
      <strong>스캔하고 청계 골목을 만나보세요.</strong>
      <div id="target" class="url"></div>
      <div class="actions"><button type="button" onclick="window.print()">인쇄하기</button><a id="openTarget" target="_blank" rel="noopener">QR 주소 열기</a></div>
      <p class="note">이 QR은 Cloudflare Pages 기본주소를 사용해 커스텀 도메인이 변경되어도 재인쇄 가능성을 줄입니다.</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.js"></script>
  <script>
    const TARGET='https://cheonggye-market.pages.dev/ai?qr=cheonggye-main&source=print';
    document.getElementById('target').textContent=TARGET;
    document.getElementById('openTarget').href=TARGET;
    QRCode.toCanvas(TARGET,{width:300,margin:2,errorCorrectionLevel:'H'},(err,canvas)=>{
      const host=document.getElementById('qrcode');
      if(err){host.textContent='QR 생성 실패';console.error(err);return;}
      host.appendChild(canvas);
    });
  </script>
</body>
</html>
